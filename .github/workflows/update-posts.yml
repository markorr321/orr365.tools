name: Update recent posts

# Keeps the Writing section on about.html showing the newest Medium posts.
# The site is static and its CSP forbids external requests, so the feed is
# fetched here and committed rather than fetched in the browser.

on:
  schedule:
    # 06:15 UTC daily. Offset from the hour because GitHub delays jobs
    # scheduled exactly on the hour when the runner queue is busy.
    - cron: '15 6 * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # needed to push the regenerated posts.js

concurrency:
  group: update-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch latest posts
        shell: pwsh
        run: ./scripts/update-posts.ps1 -Count 6

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- public/assets/js/posts.js; then
            echo "No new posts - nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/posts.js
          git commit -m "Update recent posts from Medium feed"
          git push
          echo "Pushed updated posts.js - Cloudflare will redeploy."
